server:
  port: ${PORT:8080}

spring:
  application:
    name: credit-api
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/credito_db}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:senha123}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never

ml-service:
  base-url: ${ML_SERVICE_URL:http://localhost:8000}
  timeout-ms: ${ML_SERVICE_TIMEOUT_MS:5000}

app:
  jwt:
    secret: ${JWT_SECRET:troque-este-segredo-em-producao-precisa-ter-pelo-menos-32-bytes}
    expiration-minutes: ${JWT_EXPIRATION_MINUTES:60}
