server:
  port: 8080

spring:
  application:
    name: credit-api
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/credito_db}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:senha123}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration

ml-service:
  base-url: ${ML_SERVICE_URL:http://localhost:8000}

app:
  # Usuário de sistema usado como solicitante enquanto não há autenticação (etapa 5).
  usuario-sistema-id: ${USUARIO_SISTEMA_ID:1}
